apiVersion: v1
kind: Service
metadata:
  name: hbase
spec:
  ports:
    - port: 9090
      name: thrift
    - port: 16000
      name: master
    - port: 16010
      name: master-web
    - port: 16020
      name: regionserver
    - port: 16030
      name: regionserver-web
  clusterIP: None
  selector:
    cluster: hbase
