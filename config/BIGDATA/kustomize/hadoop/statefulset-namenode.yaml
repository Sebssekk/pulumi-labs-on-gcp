apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: namenode
spec:
  serviceName: hadoop
  replicas: 1
  selector:
    matchLabels:
      app: namenode
  template:
    metadata:
      labels:
        app: namenode
        cluster: hadoop
    spec:
      containers:
      - name: namenode
        image: apache/hadoop
        args:
          - hdfs
          - namenode
        resources:
          requests:
            memory: "1Gi"
            cpu: "0.2"
          limits:
            memory: "2.5Gi"
            cpu: "1"
        ports:
        - containerPort: 9000
          name: namenode
        - containerPort: 9870
          name: http
        env:
          - name: ENSURE_NAMENODE_DIR
            value: "/tmp/hadoop-root/dfs/name"
        envFrom:
        - configMapRef:
            name: hadoop-config
        volumeMounts:
        - name: namenode-data
          mountPath: /hadoop/dfs/name
  volumeClaimTemplates:
  - metadata:
      name: namenode-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
