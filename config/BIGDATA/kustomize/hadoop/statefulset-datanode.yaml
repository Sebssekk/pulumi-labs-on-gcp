apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: datanode
spec:
  serviceName: hadoop
  replicas: 3
  selector:
    matchLabels:
      app: datanode
  template:
    metadata:
      labels:
        app: datanode
        cluster: hadoop
    spec:
      containers:
      - name: datanode
        image: apache/hadoop
        args:
          - hdfs
          - datanode
        resources:
          requests:
            memory: "1Gi"
            cpu: "0.2"
          limits:
            memory: "2.5Gi"
            cpu: "1"
        ports:
        - containerPort: 9866
          name: datanode
        - containerPort: 9864
          name: http
        envFrom:
        - configMapRef:
            name: hadoop-config
        volumeMounts:
        - name: datanode-data
          mountPath: /hadoop/dfs/data
  volumeClaimTemplates:
  - metadata:
      name: datanode-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
