apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: broker
spec:
  serviceName: kafka
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: apache/kafka
        resources:
          requests:
            memory: "512Mi"
            cpu: "0.5"
          limits:
            memory: "1Gi"
            cpu: "1"
        ports:
        - containerPort: 9092
          name: kafka-ext
        - containerPort: 19091
          name: kafka-int
        - containerPort: 9093
          name: kraft
        env:
        - name: KAFKA_LISTENERS
          value: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
        - name: KAFKA_NODE_ID 
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['apps.kubernetes.io/pod-index']  
        - name: KAFKA_ADVERTISED_LISTENERS
          value: INTERNAL://broker-$(KAFKA_NODE_ID).kafka:19092,EXTERNAL://broker-$(KAFKA_NODE_ID).kafka:9092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_PROCESS_ROLES
          value: controller,broker
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 0@broker-0.kafka:9093,1@broker-1.kafka:9093,2@broker-2.kafka:9093
        - name: KAFKA_KRAFT_CLUSTER_ID
          value: abcdefghijklmnopqrstuv